services:
  app:
    build: .
    env_file:
      - .env.local
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"

  auto-import:
    build: .
    command: ["node", "scripts/auto-import.mjs"]
    depends_on:
      - app
    env_file:
      - .env.local
    environment:
      AUTO_IMPORT_INTERVAL_MINUTES: ${AUTO_IMPORT_INTERVAL_MINUTES:-15}
      INTERNAL_APP_URL: http://app:3000
